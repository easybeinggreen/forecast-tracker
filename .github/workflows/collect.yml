name: Collect

on:
  schedule:
    - cron: "47 19 * * *"   # 05:47 Brisbane, daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch only, don't write to the database"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          TRACKER_USER_AGENT: ${{ vars.TRACKER_USER_AGENT || 'forecast-tracker (github actions)' }}
        run: python -m collector.main ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Keep the raw run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: out/
          retention-days: 30

      - name: Open an issue for each new IPO filing
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f out/new_filings.json ] || exit 0
          python - <<'EOF'
          import json, subprocess
          for f in json.load(open("out/new_filings.json")):
              title = f"New SEC filing: {f['company']} {f['form_type']} ({f['filed_on']})"
              body = f"Accession {f['accession_no']}\n\n{f.get('url') or ''}\n\nCheck the IPO steps in the forecast doc and update the forecast log."
              subprocess.run(["gh", "issue", "create", "--title", title, "--body", body], check=True)
          EOF
