name: Find markets

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Topic to search on Polymarket and Manifold"
        default: "anthropic ipo"

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m collector.find_markets "${{ inputs.query }}" | tee -a "$GITHUB_STEP_SUMMARY"
