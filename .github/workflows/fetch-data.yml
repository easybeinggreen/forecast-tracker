name: Fetch election data

# Downloads raw source files (sites unreachable from Claude's sandbox) and commits them to data/raw/.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which fetcher to run"
        default: "vec2022"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests geopandas pyogrio openpyxl
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch
        run: python vic2026/fetch/fetch_${{ inputs.job }}.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ site/data/
          git diff --cached --quiet || git commit -m "data: ${{ inputs.job }} raw files"
          git pull --rebase -q origin main
          git push
