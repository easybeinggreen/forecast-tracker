  - text: "Locals interviewed say they're \"fed up with both sides\": two years to fix a roundabout, too little parking for the growing town, rents former Labor voters can't afford. The Liberals' preselection snub of David Farrelly may push some conservatives to One Nation."
    source: "ACM (Canberra Times), 25 Oct 2026"
    url: "https://www.canberratimes.com.au/story/9379774/choosing-one-nation-disillusioned-or-just-fed-up/"
    paywalled: true
