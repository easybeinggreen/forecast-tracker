# Local issues per seat, each from a source read for this project (no source, no entry). Shown under "The place".
_rm_east: &rm_east
  text: "Roy Morgan seat poll of Bass, Hastings, Morwell and Pakenham (21–26 Oct, 283 voters): biggest concerns are cost of living (25%), government waste and corruption (23%), crime (20%) and roads and potholes (12%)."
  source: "Roy Morgan, 27 Oct 2026"
  url: "https://www.roymorgan.com/findings/10371-victorian-state-voting-intention-eastern-victoria-seats-october-2026"
_bendigo: &bendigo
  text: "Bendigo Advertiser reader survey: crime (53%), roads (45%) and cost of living (42%) top the list; some want bail and police powers overhauled and action on construction-industry corruption."
  source: "Bendigo Advertiser, 20 Aug 2026"
  url: "https://www.bendigoadvertiser.com.au/story/9334431/bendigo-voters-anger-threatens-labors-treasured-seats/"
  paywalled: true

bass: [*rm_east]
