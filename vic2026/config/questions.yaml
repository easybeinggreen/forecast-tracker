# Seat-specific questions. Each answer moves the seat calculator (shifts = first-preference points for a party,
# flows = a preference driver for this seat). Answers are saved with your locked call and reviewed each Sunday:
# if the same kind of answer keeps coming up across seats, it becomes a candidate model change.
# Written 30 Oct 2026 from seat data, coverage and the model-vs-Sportsbet gaps.

