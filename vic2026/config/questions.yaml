      - {label: "No difference", shifts: {}}
      - {label: "Hurts: she owns the government's record", shifts: {ALP: -3}}
  - q: "Who finishes second behind the leader: the Liberals or One Nation?"
    why: "It decides the seat. The model has One Nation 31%, Labor 28%, Liberal 26%, close enough that the order is a coin toss."
